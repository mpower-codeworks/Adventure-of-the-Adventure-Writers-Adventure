# AAWA - Adventure of the Adventure Writers Adventure
#
# ProDOS SYS linker map, patterned directly after the working Note II build.
#
# cc65's Apple II executable header occupies 58 bytes before the actual
# ProDOS load image.  Transfer/image tools can use that header to recover the
# ProDOS file metadata.  The actual SYS program begins at $2000.
#
# IMPORTANT: all MAIN segments are file-backed.  Do not add a type=bss
# segment here: the Apple II executable header records the full MAIN extent,
# while bss contributes no bytes to the file, producing an invalid image.

SYMBOLS {
    __EXEHDR__:   type = import;
    __FILETYPE__: type = weak, value = $00FF; # ProDOS SYS
}

MEMORY {
    HEADER: file = %O, start = $2000 - $003A, size = $003A;
    MAIN:   file = %O, define = yes, start = $2000, size = $BF00 - $2000;
}

SEGMENTS {
    EXEHDR:  load = HEADER, type = ro, optional = yes;
    STARTUP: load = MAIN,   type = ro, start = $2000;
    CODE:    load = MAIN,   type = ro;
    RODATA:  load = MAIN,   type = ro;
    DATA:    load = MAIN,   type = rw, define = yes;
}
