# AAWA 011 - raw ProDOS SYS image
# No cc65 EXEHDR/transfer wrapper.
# ProDOS SYS files load at $2000.

MEMORY {
    MAIN: file = %O, define = yes, start = $2000, size = $BF00 - $2000;
}

SEGMENTS {
    STARTUP: load = MAIN, type = ro, start = $2000;
    CODE:    load = MAIN, type = ro;
    RODATA:  load = MAIN, type = ro;
    DATA:    load = MAIN, type = rw, define = yes;
}
